<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <link href='style.css' rel='stylesheet'>
</head>
<body>
  <h1>제휴 문의</h1>
  <div class="container">
    <form action="https://formspree.io/f/xaqddajw" method="POST">
      <div class="form-group">
        <label for="name">성함/업체명</label>
        <input type="text" id="name" name="name" required placeholder="홍길동 / (주)컴퍼니">
      </div>
      
      <div class="form-group">
        <label for="email">이메일 주소</label>
        <input type="email" id="email" name="_replyto" required placeholder="example@domain.com">
      </div>

      <div class="form-group">
        <label for="category">문의 유형</label>
        <select id="category" name="category">
          <option value="partnership">비즈니스 제휴</option>
          <option value="marketing">마케팅/광고</option>
          <option value="other">기타 문의</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">문의 내용</label>
        <textarea id="message" name="message" rows="5" required placeholder="제휴하고 싶은 내용을 상세히 적어주세요."></textarea>
      </div>

      <button type="submit">문의 보내기</button>
    </form>
  </div>
  <script defer type="text/javascript" src="main.js"></script>
</body>
</html>
